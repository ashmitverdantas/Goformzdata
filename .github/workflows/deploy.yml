name: Build and Push GoFormz Image

# CI/CD (build + push only): on every push to main, build the container image
# and push it to Azure Container Registry (verdantasmcpacr). Deploying the
# image to Azure Container Apps is handled as a separate step later.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'formsDataDownload.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: verdantasmcpacr.azurecr.io
  IMAGE_REPO: goformzdata
  BUILD_CONTEXT: .      # Dockerfile + app live at the repo root

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_REPO}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" "${BUILD_CONTEXT}"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${TAG}"
